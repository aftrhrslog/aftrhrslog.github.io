{{ define "main" }}
<div class="page-head">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</div>

<div class="now-archive">
  {{ range .Pages.ByDate.Reverse }}
  <section id="{{ .Date.Format "2006-01-02" }}">
    <h2><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></h2>
    {{ .Content }}
  </section>
  {{ else }}
  <p>Nothing recorded yet.</p>
  {{ end }}
</div>
{{ end }}
